<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los números del 1 al 30 en francés · Francés para 5º de Primaria</title>
<meta name="description" content="Actividad para aprender los números del 1 al 30 en francés: tarjetas, quiz, escritura y escucha. Se abre en el navegador, sin instalar nada y sin conexión.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1020">
<style>
  :root {
    --bg: #0b1020;
    --card: rgba(255, 255, 255, 0.055);
    --card-strong: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.12);
    --ink: #eef2ff;
    --muted: #9aa8c7;
    --gold: #ffd166;
    --ok: #4ade80;
    --bad: #fb7185;
    --study: #4ade80;
    --quiz: #8b7cff;
    --write: #a3e635;
    --listen: #ffb347;
    --accent: #22d3ee;
    --radius: 20px;
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.9);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    background:
      radial-gradient(1100px 620px at 12% -12%, #2a1a5e 0%, transparent 62%),
      radial-gradient(900px 520px at 92% -6%, #0b3b53 0%, transparent 60%),
      radial-gradient(700px 500px at 50% 110%, #1b1240 0%, transparent 65%),
      var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  button, input { font: inherit; color: inherit; }

  :focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
    border-radius: 14px;
  }

  .app {
    width: min(100%, 760px);
    margin: 0 auto;
    padding: 18px 16px calc(30px + env(safe-area-inset-bottom));
  }

  /* ---------- topbar ---------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-left: -6px;
    padding: 6px 12px 6px 6px;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
  }

  .brand:hover { background: rgba(255, 255, 255, 0.05); }

  .brand__logo {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 24%, transparent);
    font-size: 1.1rem;
  }

  .brand__text { display: grid; gap: 1px; min-width: 0; }

  .brand__eyebrow {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .brand__name { font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em; }

  .stats { display: flex; gap: 8px; margin-left: auto; }

  .stat {
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: #c9d2e6;
    font-size: 0.86rem;
    font-weight: 700;
    white-space: nowrap;
  }

  .stat b { color: var(--ink); }

  /* ---------- pantallas ---------- */

  .view { display: grid; gap: 16px; }
  .view:focus { outline: none; }

  .hero { display: grid; gap: 8px; }

  .eyebrow {
    margin: 0;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(1.6rem, 6.4vw, 2.2rem);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.08;
  }

  .hero h1 em {
    font-style: normal;
    background: linear-gradient(120deg, #22d3ee, #4ade80 72%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .lead {
    margin: 0;
    max-width: 54ch;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .lead b { color: #d5dcef; }

  .banner {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border: 1px dashed var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.03);
    color: #c9d2e6;
    font-size: 0.86rem;
  }

  .banner b { color: var(--ink); }

  .modes { display: grid; gap: 10px; }

  @media (min-width: 560px) {
    .modes { grid-template-columns: 1fr 1fr; }
    /* Un número impar de modos deja el último a todo el ancho. */
    .modes > .mode:last-child:nth-child(odd) { grid-column: 1 / -1; }
  }

  .mode {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    text-align: left;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .mode:hover:not(:disabled) {
    background: var(--card-strong);
    border-color: rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .mode:disabled { cursor: not-allowed; opacity: 0.55; box-shadow: none; }

  .mode__icon {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border-radius: 12px;
    background: color-mix(in srgb, var(--mode-color, var(--accent)) 22%, transparent);
    font-size: 1.15rem;
  }

  .mode__body { display: grid; gap: 2px; min-width: 0; }
  .mode__title { font-size: 1rem; font-weight: 800; }
  .mode__desc { font-size: 0.82rem; color: var(--muted); }
  .mode__go { margin-left: auto; color: var(--muted); font-weight: 800; }

  .mode--study { --mode-color: var(--study); }
  .mode--quiz { --mode-color: var(--quiz); }
  .mode--write { --mode-color: var(--write); }
  .mode--listen { --mode-color: var(--listen); }

  .screen-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }

  .back:hover { background: var(--card-strong); }

  .screen-head h1 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .screen-head h1:focus { outline: none; }

  .progress {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 0.82rem;
    font-weight: 700;
  }

  .progress b { color: var(--ink); }

  .bar {
    flex: 1 1 auto;
    min-width: 40px;
    height: 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.09);
    overflow: hidden;
  }

  .bar > i {
    display: block;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #22d3ee, #4ade80);
    transition: width 0.25s ease;
  }

  .card {
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
  }

  .prompt {
    display: grid;
    gap: 10px;
    justify-items: center;
    text-align: center;
  }

  .prompt__number {
    margin: 0;
    font-size: clamp(3rem, 16vw, 5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    background: linear-gradient(120deg, #a5f3fc, #86efac 78%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .prompt__word {
    margin: 0;
    font-size: clamp(1.5rem, 7vw, 2.2rem);
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .prompt__question { margin: 0; color: var(--muted); font-size: 0.92rem; }

  .speak {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card-strong);
    font-weight: 800;
    cursor: pointer;
  }

  .speak:hover { background: rgba(255, 255, 255, 0.14); }

  .options { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }

  .option {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 64px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    font-size: 1.02rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }

  .option:hover:not(:disabled) {
    background: var(--card-strong);
    border-color: rgba(255, 255, 255, 0.22);
    transform: translateY(-1px);
  }

  .option:disabled { cursor: default; opacity: 0.6; }

  .option.is-ok {
    background: rgba(74, 222, 128, 0.16);
    border-color: var(--ok);
    color: #d7ffe4;
    opacity: 1;
  }

  .option.is-bad {
    background: rgba(251, 113, 133, 0.16);
    border-color: var(--bad);
    color: #ffe0e6;
    opacity: 1;
  }

  .option__number { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; }

  .feedback {
    display: grid;
    gap: 4px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    font-size: 0.9rem;
  }

  .feedback strong { font-size: 0.98rem; }
  .feedback b { color: #fff; }
  .feedback[data-tone="ok"] { border-color: rgba(74, 222, 128, 0.5); background: rgba(74, 222, 128, 0.1); }
  .feedback[data-tone="bad"] { border-color: rgba(251, 113, 133, 0.5); background: rgba(251, 113, 133, 0.1); }

  .primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 20px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, #a78bfa, #7c5cff);
    color: #0b1020;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
  }

  .primary:hover { filter: brightness(1.06); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ---------- tarjetas ---------- */

  .group-title {
    margin: 6px 0 0;
    font-size: 0.74rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .number-grid {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  }

  .number-card {
    display: grid;
    gap: 2px;
    padding: 10px 8px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    text-align: center;
    cursor: pointer;
  }

  .number-card:hover { background: var(--card-strong); }
  .number-card__n { font-size: 1.25rem; font-weight: 900; letter-spacing: -0.02em; }
  .number-card__fr { font-size: 0.78rem; color: #c9d2e6; overflow-wrap: anywhere; }

  .phrases-card h2 { margin: 0 0 8px; font-size: 0.95rem; font-weight: 800; }

  .phrases { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

  .phrase-row {
    display: grid;
    grid-template-columns: 2.6rem minmax(0, 1fr);
    grid-template-areas: "n fr" "n es";
    column-gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    text-align: left;
    font-size: 0.88rem;
    cursor: pointer;
  }

  .phrase-row:hover { background: var(--card-strong); }

  .phrase-row__n {
    grid-area: n;
    align-self: center;
    font-size: 1.05rem;
    font-weight: 900;
    color: #d5dcef;
    text-align: center;
  }

  .phrase-row__fr { grid-area: fr; font-weight: 700; }
  .phrase-row__es { grid-area: es; color: var(--muted); font-size: 0.78rem; }

  .feedback__phrase {
    margin-top: 2px;
    color: var(--muted);
    font-size: 0.86rem;
  }

  .trick { display: grid; gap: 6px; }
  .trick h2 { margin: 0; font-size: 0.95rem; font-weight: 800; }
  .trick ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 0.88rem; }
  .trick b { color: #d5dcef; }

  /* ---------- escribir ---------- */

  .write-form { display: grid; gap: 10px; }

  .write-input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.28);
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .write-input::placeholder { color: rgba(154, 168, 199, 0.75); font-weight: 600; }
  .write-input:focus { border-color: rgba(34, 211, 238, 0.6); outline: none; }
  .write-input:disabled { opacity: 0.75; }

  .write-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .hint { margin: 0; color: var(--muted); font-size: 0.82rem; }

  .summary { display: grid; gap: 6px; justify-items: center; text-align: center; }

  .summary__score {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .summary__score b { font-size: 2.6rem; color: var(--ink); letter-spacing: -0.03em; }

  .summary__message { margin: 0; font-size: 1.15rem; font-weight: 800; }

  .footnote {
    margin: 22px 0 0;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (max-width: 460px) {
    .options { grid-template-columns: 1fr 1fr; }
    .option { min-height: 58px; font-size: 0.95rem; }
    .number-grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
    .number-card__fr { font-size: 0.72rem; }
    .brand__eyebrow { display: none; }
    .stat { padding: 5px 10px; font-size: 0.8rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="../../../../index.html" aria-label="Volver al menú del proyecto">
      <span class="brand__logo" aria-hidden="true">🔢</span>
      <span class="brand__text">
        <span class="brand__eyebrow">Francés · 5º</span>
        <span class="brand__name">Números 1-30</span>
      </span>
    </a>
    <div class="stats" aria-label="Tu progreso">
      <span class="stat" title="Estrellas conseguidas">⭐ <b id="stat-stars">0</b></span>
      <span class="stat" title="Mejor racha de aciertos">🔥 <b id="stat-streak">0</b></span>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <audio id="audio" preload="auto"></audio>

  <p class="footnote" id="footnote"></p>
</div>

<script src="datos.js"></script>
<script>
(function () {
  "use strict";

  // Los números viven en datos.js, el mismo fichero del que salen las
  // grabaciones: así la página y el audio no se pueden separar.
  const KEY = "acp.frances.numeros";
  const PROBE_WORD = NUMBERS[0].fr;
  const ROUNDS = 10;

  const view = document.getElementById("view");
  const starsEl = document.getElementById("stat-stars");
  const streakEl = document.getElementById("stat-streak");
  const footnote = document.getElementById("footnote");

  const profile = loadProfile();
  const state = { screen: "home", quiz: null, write: null };

  /* ---------- progreso ---------- */

  function loadProfile() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY));
      if (raw && typeof raw === "object") {
        return { stars: Number(raw.stars) || 0, best: Number(raw.best) || 0 };
      }
    } catch (error) {
      // Sin almacenamiento (o con él bloqueado) se juega igual: no se guarda.
    }
    return { stars: 0, best: 0 };
  }

  function saveProfile() {
    try {
      localStorage.setItem(KEY, JSON.stringify(profile));
    } catch (error) {
      // Igual que arriba: el progreso se queda sólo en esta visita.
    }
  }

  function paintStats() {
    starsEl.textContent = profile.stars;
    streakEl.textContent = profile.best;
  }

  /* ---------- sonido ---------- */

  // Un solo reproductor para todas las grabaciones de la actividad.
  const Sonido = {
    element: document.getElementById("audio"),
    // null = todavía no sabemos si las grabaciones están; false = faltan.
    available: null,

    slug(word) {
      return word.replace(/\s+/g, "-");
    },

    play(word, kind) {
      const element = this.element;
      element.pause();
      element.src = `assets/audio/${this.slug(word)}${kind === "phrase" ? "-phrase" : ""}.mp3`;
      try {
        element.currentTime = 0;
      } catch (error) {
        // Algunos navegadores no dejan fijar el tiempo antes de cargar.
      }
      const playing = element.play();
      if (playing && typeof playing.catch === "function") playing.catch(() => {});
      return true;
    },

    // Una sola grabación de prueba dice si la carpeta assets está en su sitio.
    check(firstWord, onResult) {
      const probe = new Audio(`assets/audio/${this.slug(firstWord)}.mp3`);
      probe.preload = "auto";
      probe.addEventListener("loadedmetadata", () => onResult(true), { once: true });
      probe.addEventListener("error", () => onResult(false), { once: true });
    }
  };

  function initSound() {
    Sonido.check(PROBE_WORD, (available) => {
      Sonido.available = available;
      paintNote();
      if (state.screen === "home") renderHome();
    });
  }

  function paintNote() {
    if (Sonido.available === false) {
      footnote.textContent =
        "No encontramos las grabaciones (¿está la carpeta assets junto a index.html?). " +
        "Las actividades funcionan igual, pero sin sonido.";
      return;
    }
    footnote.textContent =
      "El sonido usa grabaciones incluidas con la actividad: no hace falta conexión. " +
      "Toca una tarjeta para volver a escucharla.";
  }

  /* ---------- utilidades ---------- */

  const random = (limit) => Math.floor(Math.random() * limit);
  const pick = (list) => list[random(list.length)];

  function shuffle(list) {
    const copy = list.slice();
    for (let i = copy.length - 1; i > 0; i -= 1) {
      const j = random(i + 1);
      const swap = copy[i];
      copy[i] = copy[j];
      copy[j] = swap;
    }
    return copy;
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // Acepta "dix-sept", "dix sept" o "DIX  SEPT": la ortografía es lo que cuenta.
  function normalize(text) {
    return String(text)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[’']/g, " ")
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function renderScreen(html, focusSelector) {
    view.innerHTML = html;
    const target = focusSelector ? view.querySelector(focusSelector) : null;
    if (target) target.focus();
    else view.focus();
  }

  /* ---------- pantallas ---------- */

  function modeCard(action, icon, title, description, disabled) {
    return `
      <button class="mode mode--${action}" data-action="${action}"${disabled ? " disabled" : ""}>
        <span class="mode__icon" aria-hidden="true">${icon}</span>
        <span class="mode__body">
          <span class="mode__title">${title}</span>
          <span class="mode__desc">${description}</span>
        </span>
        <span class="mode__go" aria-hidden="true">→</span>
      </button>`;
  }

  function homeHtml() {
    const canListen = Sonido.available !== false;
    return `
      <section class="hero">
        <p class="eyebrow">Francés · 5º de Primaria</p>
        <h1>Del 1 al <em>30</em></h1>
        <p class="lead">Los treinta números en francés, con su escritura, su pronunciación y
          una frase de ejemplo. Elige cómo quieres practicar: mirar, elegir, escribir,
          escuchar o entender frases.</p>
      </section>
      ${canListen ? "" : `
      <div class="banner" role="status">
        <span aria-hidden="true">🔈</span>
        <span>No encontramos las grabaciones de esta actividad: se puede jugar a todo
          menos a <b>Escucha</b>. Copia la carpeta <b>assets</b> junto a index.html.</span>
      </div>`}
      <div class="modes">
        ${modeCard("study", "🃏", "Tarjetas", "Los números del 1 al 30 y cómo se escriben")}
        ${modeCard("quiz", "⚡", "Quiz", "Diez preguntas para elegir el número o su nombre")}
        ${modeCard("write", "⌨️", "Escribir", "Teclea en francés el número que te pidan")}
        ${modeCard("listen", "🎧", "Escucha", canListen ? "Oye el número en francés y encuéntralo" : "Faltan las grabaciones de esta actividad", !canListen)}
        ${modeCard("phrase", "🗣️", "Frases", canListen ? "Escucha una frase y encuentra el número que nombra" : "Faltan las grabaciones de esta actividad", !canListen)}
      </div>`;
  }

  function numberCardHtml(item) {
    return `
      <button class="number-card" data-action="speak" data-say="${item.fr}"
        aria-label="${item.n}, ${item.fr}">
        <span class="number-card__n">${item.n}</span>
        <span class="number-card__fr">${item.fr}</span>
      </button>`;
  }

  function groupHtml(title, from, to) {
    return `
      <h2 class="group-title">${title}</h2>
      <div class="number-grid">
        ${NUMBERS.filter((item) => item.n >= from && item.n <= to)
          .map(numberCardHtml)
          .join("")}
      </div>`;
  }

  function studyHtml() {
    return `
      <div class="screen-head">
        <button class="back" data-action="home">← Menú</button>
        <h1 tabindex="-1">Tarjetas</h1>
      </div>
      <p class="lead">Toca un número para escuchar cómo se dice, o una frase para oírla entera.</p>
      ${groupHtml("Del 1 al 10", 1, 10)}
      ${groupHtml("Del 11 al 20", 11, 20)}
      ${groupHtml("Del 21 al 30", 21, 30)}
      <div class="card trick">
        <h2>Trucos para escribirlos</h2>
        <ul>
          <li><b>17, 18 y 19</b> se hacen con <i>dix-</i>: <b>dix-sept</b>, <b>dix-huit</b>, <b>dix-neuf</b>.</li>
          <li><b>21</b> lleva <i>et</i> suelto: <b>vingt et un</b>.</li>
          <li>Del <b>22 al 29</b> se escribe <i>vingt-</i> con guion: <b>vingt-deux</b>, … <b>vingt-neuf</b>.</li>
          <li>Al llegar a <b>30</b>, palabra nueva: <b>trente</b>.</li>
        </ul>
      </div>
      <div class="card phrases-card">
        <h2>Frases para escuchar</h2>
        <ul class="phrases">
          ${NUMBERS.map((item) => `
            <li>
              <button class="phrase-row" data-action="speak" data-say="${item.fr}" data-kind="phrase"
                aria-label="Escuchar la frase: ${item.phrase.fr} ${item.phrase.es}">
                <span class="phrase-row__n">${item.n}</span>
                <span class="phrase-row__fr"><span aria-hidden="true">🔊</span> ${item.phrase.fr}</span>
                <span class="phrase-row__es">${item.phrase.es}</span>
              </button>
            </li>`).join("")}
        </ul>
      </div>`;
  }

  /* ---------- quiz y escucha ---------- */

  const MODE_TITLES = { quiz: "Quiz", listen: "Escucha", phrase: "Frases" };

  function newRound(mode) {
    const previous = state.quiz ? state.quiz.round.target : null;
    const target = pick(previous ? NUMBERS.filter((item) => item.n !== previous.n) : NUMBERS);
    const types = {
      quiz: ["number-fr", "fr-number"],
      listen: ["listen-number"],
      phrase: ["phrase-number"]
    };
    const others = shuffle(NUMBERS.filter((item) => item.n !== target.n)).slice(0, 3);
    return { target, type: pick(types[mode]), options: shuffle([target, ...others]) };
  }

  function hasAudioPrompt(quiz) {
    return quiz.mode === "listen" || quiz.mode === "phrase";
  }

  // En Escucha y en Frases la grabación suena al empezar la ronda.
  function playPrompt(quiz) {
    if (!quiz || quiz.answered) return;
    if (quiz.mode === "listen") Sonido.play(quiz.round.target.fr);
    if (quiz.mode === "phrase") Sonido.play(quiz.round.target.fr, "phrase");
  }

  function startQuiz(mode) {
    state.screen = mode;
    state.write = null;
    state.quiz = {
      index: 0,
      total: ROUNDS,
      correct: 0,
      streak: 0,
      answered: false,
      chosen: null,
      mode,
      round: newRound(mode)
    };
    renderScreen(quizHtml(), hasAudioPrompt(state.quiz) ? "[data-action='speak']" : ".option");
    playPrompt(state.quiz);
  }

  function promptHtml(round, mode) {
    const target = round.target;
    if (mode === "phrase") {
      return `<button class="speak" data-action="speak" data-say="${target.fr}" data-kind="phrase">
        🔊 Escuchar la frase</button>`;
    }
    if (mode === "listen") {
      return `<button class="speak" data-action="speak" data-say="${target.fr}">
        🔊 Escuchar otra vez</button>`;
    }
    if (round.type === "number-fr") {
      return `<p class="prompt__number">${target.n}</p>`;
    }
    return `<p class="prompt__word">${target.fr}</p>`;
  }

  function questionText(round, mode) {
    if (mode === "phrase") return "Escucha la frase y elige el número que nombra.";
    if (mode === "listen") return "Escucha el número y elige cuál es.";
    if (round.type === "number-fr") return "¿Cómo se escribe en francés?";
    return "¿Qué número es?";
  }

  function optionHtml(option, round, quiz) {
    const numberOption =
      round.type === "fr-number" || round.type === "listen-number" || round.type === "phrase-number";
    const isRight = quiz.answered && option.n === round.target.n;
    const isChosen = quiz.answered && quiz.chosen === option.fr;
    const classes = ["option"];
    if (isRight) classes.push("is-ok");
    else if (isChosen) classes.push("is-bad");
    const content = numberOption
      ? `<span class="option__number">${option.n}</span>`
      : `<span>${option.fr}</span>`;
    return `<button class="${classes.join(" ")}" data-action="answer"
      data-value="${option.fr}"${quiz.answered ? " disabled" : ""}>${content}</button>`;
  }

  function feedbackHtml(quiz) {
    if (!quiz.answered) return "";
    const right = quiz.chosen === quiz.round.target.fr;
    const target = quiz.round.target;
    return `
      <div class="feedback" data-tone="${right ? "ok" : "bad"}" aria-live="polite">
        <strong>${right ? "¡Bien!" : "Casi…"}</strong>
        <span><b>${target.n}</b> se escribe <b>${target.fr}</b>.</span>
        <span class="feedback__phrase">${target.phrase.fr} · ${target.phrase.es}</span>
      </div>
      <div class="actions">
        <button class="speak" data-action="speak" data-say="${target.fr}" data-kind="phrase">
          🔊 La frase
        </button>
        <button class="primary" data-action="next">
          ${quiz.index + 1 < quiz.total ? "Siguiente →" : "Ver resultado →"}
        </button>
      </div>`;
  }

  function quizHtml() {
    const quiz = state.quiz;
    const round = quiz.round;
    return `
      <div class="screen-head">
        <button class="back" data-action="home">← Menú</button>
        <h1 tabindex="-1">${MODE_TITLES[quiz.mode]}</h1>
      </div>
      <div class="progress">
        <span>Pregunta <b>${quiz.index + 1}</b> de ${quiz.total}</span>
        <span class="bar" aria-hidden="true">
          <i style="width:${Math.round((quiz.index / quiz.total) * 100)}%"></i>
        </span>
        <span>🔥 ${quiz.streak}</span>
      </div>
      <div class="card prompt">
        ${promptHtml(round, quiz.mode)}
        <p class="prompt__question">${questionText(round, quiz.mode)}</p>
      </div>
      <div class="options">
        ${round.options.map((option) => optionHtml(option, round, quiz)).join("")}
      </div>
      ${feedbackHtml(quiz)}`;
  }

  function answer(value) {
    const quiz = state.quiz;
    if (!quiz || quiz.answered) return;
    quiz.answered = true;
    quiz.chosen = value;
    if (value === quiz.round.target.fr) {
      quiz.correct += 1;
      quiz.streak += 1;
      profile.stars += 1;
      profile.best = Math.max(profile.best, quiz.streak);
      saveProfile();
      paintStats();
    } else {
      quiz.streak = 0;
    }
    if (quiz.mode === "listen") Sonido.play(quiz.round.target.fr);
    if (quiz.mode === "phrase") Sonido.play(quiz.round.target.fr, "phrase");
    renderScreen(quizHtml(), "[data-action='next']");
  }

  function nextRound() {
    const quiz = state.quiz;
    if (!quiz) return;
    if (quiz.index + 1 >= quiz.total) {
      renderScreen(summaryHtml(), "[data-action='again']");
      return;
    }
    quiz.index += 1;
    quiz.answered = false;
    quiz.chosen = null;
    quiz.round = newRound(quiz.mode);
    renderScreen(quizHtml(), hasAudioPrompt(quiz) ? "[data-action='speak']" : ".option");
    playPrompt(quiz);
  }

  function summaryHtml() {
    const quiz = state.quiz;
    const ratio = quiz.correct / quiz.total;
    const message = ratio === 1
      ? "¡Perfecto, todo bien!"
      : ratio >= 0.7
        ? "¡Muy bien!"
        : ratio >= 0.4
          ? "Vas cogiendo el ritmo"
          : "Sigue practicando, ya verás";
    return `
      <div class="screen-head">
        <button class="back" data-action="home">← Menú</button>
        <h1 tabindex="-1">Resultado</h1>
      </div>
      <div class="card summary">
        <p class="summary__score"><b>${quiz.correct}</b> de ${quiz.total}</p>
        <p class="summary__message">${message}</p>
        <p class="lead">${quiz.correct === 1
          ? "Has ganado 1 estrella en esta ronda."
          : `Has ganado ${quiz.correct} estrellas en esta ronda.`}</p>
      </div>
      <div class="actions">
        <button class="primary" data-action="again" data-mode="${quiz.mode}">
          Otra ronda →
        </button>
        <button class="back" data-action="home">Volver al menú</button>
      </div>`;
  }

  /* ---------- escribir ---------- */

  function startWrite() {
    state.screen = "write";
    state.quiz = null;
    state.write = {
      index: 0,
      total: ROUNDS,
      correct: 0,
      streak: 0,
      answered: false,
      value: "",
      right: false,
      round: pick(NUMBERS)
    };
    renderScreen(writeHtml(), "#write-input");
  }

  function writeHtml() {
    const game = state.write;
    const target = game.round;
    const answered = game.answered;
    return `
      <div class="screen-head">
        <button class="back" data-action="home">← Menú</button>
        <h1 tabindex="-1">Escribir</h1>
      </div>
      <div class="progress">
        <span>Pregunta <b>${game.index + 1}</b> de ${game.total}</span>
        <span class="bar" aria-hidden="true">
          <i style="width:${Math.round((game.index / game.total) * 100)}%"></i>
        </span>
        <span>🔥 ${game.streak}</span>
      </div>
      <div class="card prompt">
        <p class="prompt__number">${target.n}</p>
        <p class="prompt__question">Escribe este número en francés.</p>
      </div>
      <form class="write-form" data-form="write">
        <label class="hint" for="write-input">Con o sin guiones; da igual mayúsculas.</label>
        <input id="write-input" class="write-input" name="answer" type="text"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
          placeholder="escríbelo aquí" value="${escapeHtml(game.value)}"${answered ? " disabled" : ""}>
        ${answered ? "" : `<div class="write-row">
          <button class="primary" type="submit">Comprobar</button>
        </div>`}
      </form>
      ${answered ? `
        <div class="feedback" data-tone="${game.right ? "ok" : "bad"}" aria-live="polite">
          <strong>${game.right ? "¡Bien escrito!" : "Casi…"}</strong>
          <span>${target.n} se escribe <b>${target.fr}</b>.</span>
          <span class="feedback__phrase">${target.phrase.fr} · ${target.phrase.es}</span>
        </div>
        <div class="actions">
          <button class="speak" data-action="speak" data-say="${target.fr}" data-kind="phrase">
            🔊 La frase
          </button>
          <button class="primary" data-action="next">
            ${game.index + 1 < game.total ? "Siguiente →" : "Ver resultado →"}
          </button>
        </div>` : ""}`;
  }

  function checkWrite() {
    const game = state.write;
    if (!game || game.answered) return;
    const target = game.round;
    const input = document.getElementById("write-input");
    game.value = input ? input.value : "";
    game.answered = true;
    game.right = normalize(game.value) === normalize(target.fr);
    if (game.right) {
      game.correct += 1;
      game.streak += 1;
      profile.stars += 1;
      profile.best = Math.max(profile.best, game.streak);
      saveProfile();
      paintStats();
    } else {
      game.streak = 0;
    }
    Sonido.play(target.fr);
    renderScreen(writeHtml(), "[data-action='next']");
  }

  function nextWrite() {
    const game = state.write;
    if (!game) return;
    if (game.index + 1 >= game.total) {
      renderScreen(writeSummaryHtml(), "[data-action='again']");
      return;
    }
    game.index += 1;
    game.answered = false;
    game.value = "";
    game.round = pick(NUMBERS.filter((item) => item.n !== game.round.n));
    renderScreen(writeHtml(), "#write-input");
  }

  function writeSummaryHtml() {
    const game = state.write;
    const ratio = game.correct / game.total;
    const message = ratio === 1
      ? "¡Perfecto, sin una falta!"
      : ratio >= 0.7
        ? "¡Muy bien!"
        : ratio >= 0.4
          ? "Vas cogiendo el ritmo"
          : "Sigue practicando: mira las tarjetas y vuelve";
    return `
      <div class="screen-head">
        <button class="back" data-action="home">← Menú</button>
        <h1 tabindex="-1">Resultado</h1>
      </div>
      <div class="card summary">
        <p class="summary__score"><b>${game.correct}</b> de ${game.total}</p>
        <p class="summary__message">${message}</p>
        <p class="lead">${game.correct === 1
          ? "Has ganado 1 estrella escribiendo."
          : `Has ganado ${game.correct} estrellas escribiendo.`}</p>
      </div>
      <div class="actions">
        <button class="primary" data-action="again" data-mode="write">Otra ronda →</button>
        <button class="back" data-action="home">Volver al menú</button>
      </div>`;
  }

  /* ---------- navegación ---------- */

  function renderHome() {
    state.screen = "home";
    state.quiz = null;
    state.write = null;
    renderScreen(homeHtml(), "h1");
  }

  view.addEventListener("click", (event) => {
    const trigger = event.target.closest("[data-action]");
    if (!trigger) return;
    const action = trigger.dataset.action;

    if (action === "home") return renderHome();
    if (action === "study") {
      state.screen = "study";
      state.quiz = null;
      state.write = null;
      renderScreen(studyHtml(), "h1");
      return;
    }
    if (action === "quiz") return startQuiz("quiz");
    if (action === "listen") return startQuiz("listen");
    if (action === "phrase") return startQuiz("phrase");
    if (action === "write") return startWrite();
    if (action === "answer") return answer(trigger.dataset.value);
    if (action === "next") return state.write ? nextWrite() : nextRound();
    if (action === "again") {
      const mode = trigger.dataset.mode;
      return mode === "write" ? startWrite() : startQuiz(mode || "quiz");
    }
    if (action === "speak") {
      Sonido.play(trigger.dataset.say, trigger.dataset.kind);
      return;
    }
  });

  view.addEventListener("submit", (event) => {
    event.preventDefault();
    if (state.screen === "write" && !state.write.answered) checkWrite();
  });

  paintStats();
  initSound();
  renderScreen(homeHtml(), "h1");
})();
</script>
</body>
</html>
